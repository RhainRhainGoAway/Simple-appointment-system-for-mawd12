<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Consultation</title>

    <!--CSS-->
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/book-schedule.css">
    <link rel="stylesheet" href="/css/book.css">

    <!--Bootstrap 5 CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!--box icons para sa mga icons na gagamitin-->
    <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <!-- Sidebar will be injected here -->
    <div id="sidebar-container"></div>

    <!-- Page-specific content -->
    <section class="home">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Book Consultation</h2>
            
            <!-- Date Controls -->
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-secondary rounded-pill px-4">Today</button>
                <div class="d-flex align-items-center gap-2">
                    <button class="date-nav-btn" onclick="previousWeek()">
                        <i class='bx bx-chevron-left'></i>
                    </button>
                    <div class="date-range">
                        <i class='bx bx-calendar'></i>
                        <span id="dateRangeText">22-26 Sep, 2025</span>
                    </div>
                    <button class="date-nav-btn" onclick="nextWeek()">
                        <i class='bx bx-chevron-right'></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Schedule Table -->
        <div class="schedule-table">
            <table class="table table-borderless mb-0">
                <thead>
                    <tr>
                        <th style="width: 250px;">Teachers</th>
                        <th>22 Mon</th>
                        <th>23 Tue</th>
                        <th>24 Wed</th>
                        <th>25 Thurs</th>
                        <th>26 Fri</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Teacher 1: Ms. Kim Chaehyun -->
                    <tr>
                        <td>
                            <div class="teacher-info">
                                <img src="/assets/baek jiheon.png" alt="Teacher" class="teacher-avatar">
                                <div>
                                    <p class="teacher-name">Ms. Kim Chaehyun</p>
                                    <p class="teacher-subject">Physical Science</p>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot closed">Closed</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">10:00 AM - 12:00 PM</button>
                                <button class="time-slot">1:00 PM - 2:00 PM</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">9:30 AM - 12:00 PM</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot closed">Closed</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">9:00 AM - 10:00 AM</button>
                            </div>
                        </td>
                    </tr>

                    <!-- Teacher 2: Ms. Jang Wonyoung -->
                    <tr>
                        <td>
                            <div class="teacher-info">
                                <img src="/assets/professor urada.png" alt="Teacher" class="teacher-avatar">
                                <div>
                                    <p class="teacher-name">Ms. Jang Wonyoung</p>
                                    <p class="teacher-subject">Computer Programming 4</p>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">10:00 AM - 10:30 AM</button>
                                <button class="time-slot">2:30 PM - 3:00 PM</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">10:00 AM - 10:30 AM</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">1:00 PM - 3:00 PM</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">1:00 PM - 4:00 PM</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot closed">Closed</button>
                            </div>
                        </td>
                    </tr>

                    <!-- Teacher 3: Ms. Kim Minju -->
                    <tr>
                        <td>
                            <div class="teacher-info">
                                <img src="/assets/justin nabunturan.png" alt="Teacher" class="teacher-avatar">
                                <div>
                                    <p class="teacher-name">Ms. Kim Minju</p>
                                    <p class="teacher-subject">Computer Programming 5</p>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">10:00 AM - 12:00 PM</button>

                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">10:30 AM - 12:00 PM</button>

                        </td>
                        <td>
                            <div class="slots-container">

                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">8:30 AM - 10:30 AM</button>
                            </div>
                        </td>
                    </tr>

                    <!-- Teacher 4: Ms. An Yujin -->
                    <tr>
                        <td>
                            <div class="teacher-info">
                                <img src="/assets/Malvar, Rhain B..jpg" alt="Teacher" class="teacher-avatar">
                                <div>
                                    <p class="teacher-name">Ms. An Yujin</p>
                                    <p class="teacher-subject">Personal Development</p>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot closed">Closed</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">10:00 AM - 12:00 PM</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">10:30 AM - 12:00 PM</button>
                                <button class="time-slot">2:00 PM - 4:00 PM</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">10:30 AM - 12:00 PM</button>
                                <button class="time-slot">4:00 PM - 5:00 PM</button>
                            </div>
                        </td>
                        <td>
                            <div class="slots-container">
                                <button class="time-slot">10:00 AM - 12:00 PM</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- Pagination -->
            <nav class="d-flex justify-content-end p-3 border-top">
                <ul class="pagination pagination-sm mb-0">
                <li class="page-item">
                    <a class="page-link rounded-circle border-0" href="#" aria-label="Previous">
                        <i class='bx bx-chevron-left'></i>
                    </a>
                </li>
                <li class="page-item"><a class="page-link rounded-circle border-0" href="#">1</a></li>
                <li class="page-item active"><a class="page-link rounded-circle border-0 bg-primary" href="#">2</a></li>
                <li class="page-item"><a class="page-link rounded-circle border-0" href="#">3</a></li>
