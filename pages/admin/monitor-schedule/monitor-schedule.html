<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Schedule - Admin</title>

    <!--CSS-->
    <link rel="stylesheet" href="../../../shared/css/sidebar.css">
    <link rel="stylesheet" href="./monitor-schedule.css?v=20260519">
    <link rel="stylesheet" href="../../../shared/css/alerts.css">

    <!--Bootstrap 5 CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!--box icons-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css?v=2' rel='stylesheet'>
</head>
<body>
    <div id="sidebar-container"></div>

    <section class="home">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h2 class="fw-bold mb-0">Monitor Schedule</h2>
                <p class="text-muted mb-0">View teacher availability for the week</p>
            </div>

            <div class="d-flex align-items-center gap-3 flex-wrap">
                <button class="btn btn-outline-secondary rounded-pill px-4" onclick="goToToday()">Today</button>
                <div class="d-flex align-items-center gap-2">
                    <button class="date-nav-btn" onclick="previousWeek()">
                        <i class='bx bx-chevron-left'></i>
                    </button>
                    <div class="date-range">
                        <i class='bx bx-calendar'></i>
                        <span id="dateRangeText">—</span>
                    </div>
                    <button class="date-nav-btn" onclick="nextWeek()">
                        <i class='bx bx-chevron-right'></i>
                    </button>
                </div>

                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search">
                    <i class='bx bx-search'></i>
                </div>
            </div>
        </div>

        <div class="schedule-table">
            <table class="table table-borderless mb-0">
                <thead>
                    <tr>
                        <th style="width: 250px;">Teachers</th>
                        <th>Mon</th>
                        <th>Tue</th>
                        <th>Wed</th>
                        <th>Thurs</th>
                        <th>Fri</th>
                    </tr>
                </thead>
                <tbody id="teacherScheduleBody">
                    <tr><td colspan="6" class="text-center text-muted py-4">Loading teacher schedules...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-container" id="paginationContainer"></div>
    </section>

    <script src="/appointment_system/shared/js/alerts.js"></script>
    <script src="/appointment_system/shared/js/api.js"></script>
    <script src="/appointment_system/shared/js/load-sidebar-admin.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script src="./monitor-schedule.js?v=20260519"></script>
</body>
</html>
