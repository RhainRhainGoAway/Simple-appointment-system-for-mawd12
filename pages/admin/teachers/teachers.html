<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers - Admin</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../../../shared/css/sidebar.css">
    <link rel="stylesheet" href="./teachers.css">
    <link rel="stylesheet" href="../../../shared/css/alerts.css">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Box Icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css?v=2' rel='stylesheet'>
</head>
<body>
    <div id="sidebar-container"></div>

    <section class="home">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h2 class="fw-bold mb-0">Teachers</h2>
                <p class="text-muted mb-0">List of teachers and consulted minutes per week</p>
            </div>

            <div class="d-flex align-items-center gap-3 flex-wrap">
                <button class="btn btn-outline-secondary rounded-pill px-4" onclick="goToToday()">Today</button>

                <div class="d-flex align-items-center gap-2">
                    <button class="date-nav-btn" onclick="previousWeek()">
                        <i class='bx bx-chevron-left'></i>
                    </button>
                    <div class="date-range">
                        <i class='bx bx-calendar'></i>
                        <span id="dateRangeText">—</span>
                    </div>
                    <button class="date-nav-btn" id="nextWeekBtn" onclick="nextWeek()">
                        <i class='bx bx-chevron-right'></i>
                    </button>
                </div>

                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search">
                    <i class='bx bx-search'></i>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table class="pending-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Consulted Minutes</th>
                    </tr>
                </thead>
                <tbody id="teachersTableBody"></tbody>
            </table>

            <div id="emptyState" class="empty-state" style="display: none;">
                <i class='bx bx-user-x'></i>
                <p>No teachers found.</p>
            </div>

            <div id="loadingState" class="loading-state">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Loading teachers...</p>
            </div>
        </div>

        <div class="pagination-container" id="paginationContainer"></div>
    </section>

    <!-- View Details Modal (match Pending Requests design) -->
    <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Consulted Minutes Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="detailsModalBody"></div>
            </div>
        </div>
    </div>

    <script src="/appointment_system/shared/js/load-sidebar-admin.js"></script>
    <script src="/appointment_system/shared/js/alerts.js"></script>
    <script src="/appointment_system/shared/js/api.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script src="./teachers.js"></script>
</body>
</html>
