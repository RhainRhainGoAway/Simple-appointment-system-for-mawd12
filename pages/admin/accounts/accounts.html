<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts - Admin</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../../../shared/css/sidebar.css">
    <link rel="stylesheet" href="./accounts.css">
    <link rel="stylesheet" href="../../../shared/css/alerts.css">
    <link rel="stylesheet" href="/appointment_system/components/modals/book.css">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Box Icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css?v=2' rel='stylesheet'>
</head>
<body>
    <div id="sidebar-container"></div>

    <section class="home">
        <div class="header-row">
            <div class="page-header">
                <h2>Accounts</h2>
                <p>Manage student and teacher accounts</p>
            </div>

            <div class="header-actions">
                <button class="btn btn-primary rounded-pill" id="createTeacherBtn">
                    <i class='bx bx-user-plus'></i>
                    Create Teacher
                </button>

                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search">
                    <i class='bx bx-search'></i>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="pending-table accounts-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Email</th>
                            <th>Student No.</th>
                            <th>Section</th>
                            <th>Grade Level</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="accountsTableBody"></tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <i class='bx bx-user-x'></i>
                <p>No accounts found.</p>
            </div>

            <div id="loadingState" class="loading-state">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Loading accounts...</p>
            </div>
        </div>

        <div class="pagination-container" id="paginationContainer"></div>
    </section>

    <!-- Create Teacher Modal -->
    <div class="modal fade app-modal" id="createTeacherModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Create Teacher Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="createTeacherForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="teacherName">Name</label>
                            <input class="form-control" type="text" id="teacherName" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="teacherEmail">Email</label>
                            <input class="form-control" type="email" id="teacherEmail" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="teacherPassword">Password</label>
                            <input class="form-control" type="password" id="teacherPassword" name="password" autocomplete="new-password" required>
                        </div>
                        <div class="text-muted small">Only @santarosa.sti.edu.ph emails are allowed.</div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary px-4 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4 rounded-pill">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal fade app-modal" id="changePasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Change Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="changePasswordForm">
                    <div class="modal-body">
                        <input type="hidden" id="changePasswordUserId">
                        <div class="account-summary">
                            <div class="summary-label">Account</div>
                            <div class="summary-value" id="passwordAccountName">-</div>
                            <div class="summary-sub" id="passwordAccountEmail">-</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="newPassword">New Password</label>
                            <input class="form-control" type="password" id="newPassword" name="newPassword" autocomplete="new-password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="confirmPassword">Confirm New Password</label>
                            <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary px-4 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4 rounded-pill">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/appointment_system/shared/js/load-sidebar-admin.js"></script>
    <script src="/appointment_system/shared/js/alerts.js"></script>
    <script src="/appointment_system/shared/js/api.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script src="./accounts.js"></script>
</body>
</html>
