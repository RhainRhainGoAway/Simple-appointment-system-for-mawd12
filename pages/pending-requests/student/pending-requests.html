<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Requests - Student</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../../../shared/css/sidebar.css">
    <link rel="stylesheet" href="./pending-requests.css">
    <link rel="stylesheet" href="../../../shared/css/alerts.css">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Box Icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css?v=2' rel='stylesheet'>
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Page Content -->
    <section class="home">
        <!-- Header -->
        <div class="page-header">
            <h2>Pending Request</h2>
            <p>Access your pending reviews and history for consultation schedules</p>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table class="pending-table">
                <thead>
                    <tr>
                        <th>Teacher</th>
                        <th>Subject</th>
                        <th>Appointment Date & Time</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="pendingTableBody">
                    <!-- Rows loaded dynamically via JS -->
                </tbody>
            </table>

            <!-- Empty state -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class='bx bx-calendar-x'></i>
                <p>No pending requests found.</p>
            </div>

            <!-- Loading state -->
            <div id="loadingState" class="loading-state">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Loading pending requests...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination-container" id="paginationContainer">
            <!-- Pagination buttons rendered by JS -->
        </div>
    </section>

    <!-- View Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Appointment Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="detailsModalBody">
                    <!-- Details filled by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/appointment_system/shared/js/load-sidebar-student.js"></script>
    <script src="/appointment_system/shared/js/alerts.js"></script>
    <script src="/appointment_system/shared/js/api.js"></script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Page JS -->
    <script src="./pending-requests.js"></script>
</body>
</html>
