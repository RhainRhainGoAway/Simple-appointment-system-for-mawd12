<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Consultation</title>

    <!--CSS-->
    <link rel="stylesheet" href="../../shared/css/sidebar.css">
    <link rel="stylesheet" href="./book-schedule.css">
    <link rel="stylesheet" href="../../components/modals/book.css">
    <link rel="stylesheet" href="../../shared/css/alerts.css">

    <!--Bootstrap 5 CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!--box icons para sa mga icons na gagamitin-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css?v=2' rel='stylesheet'>
</head>
<body>
    <!-- Sidebar will be injected here -->
    <div id="sidebar-container"></div>

    <!-- Page-specific content -->
    <section class="home">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Book Consultation</h2>
            
            <!-- Date Controls -->
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-secondary rounded-pill px-4">Today</button>
                <div class="d-flex align-items-center gap-2">
                    <button class="date-nav-btn" onclick="previousWeek()">
                        <i class='bx bx-chevron-left'></i>
                    </button>
                    <div class="date-range">
                        <i class='bx bx-calendar'></i>
                        <span id="dateRangeText">22-26 Sep, 2025</span>
                    </div>
                    <button class="date-nav-btn" onclick="nextWeek()">
                        <i class='bx bx-chevron-right'></i>
                    </button>
                </div>

                <!-- Search bar -->
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search">
                    <i class='bx bx-search'></i>
                </div>
            </div>
        </div>

        <!-- Schedule Table -->
        <div class="schedule-table">
            <table class="table table-borderless mb-0">
                <thead>
                    <tr>
                        <th style="width: 250px;">Teachers</th>
                        <th>22 Mon</th>
                        <th>23 Tue</th>
                        <th>24 Wed</th>
                        <th>25 Thurs</th>
                        <th>26 Fri</th>
                    </tr>
                </thead>
                <tbody id="teacherScheduleBody">
                    <tr><td colspan="6" class="text-center text-muted py-4">Loading teacher schedules...</td></tr>
                </tbody>
            </table>
            <!-- Pagination -->
            <div class="pagination-container p-3 border-top" id="paginationContainer"></div>
        </div>
    </section>

    <!-- Booking Modal Container -->
    <div id="booking-modal-container"></div>

    <script src="/appointment_system/shared/js/alerts.js"></script>
    <script src="/appointment_system/shared/js/api.js"></script>
    <script src="/appointment_system/shared/js/load-sidebar-student.js"></script>

    <!--Bootstrap 5 JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!--Book Schedule JS-->
    <script src="./book-schedule.js"></script>

    <!--Booking Modal JS-->
    <script src="../../components/modals/book.js"></script>

    <!-- Booking Modal Container -->
    <div id="booking-modal-container"></div>
</body>
</html>
