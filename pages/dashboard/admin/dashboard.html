<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin</title>

    <!--CSS-->
    <link rel="stylesheet" href="../../../shared/css/sidebar.css">
    <link rel="stylesheet" href="./dashboard.css">
    <link rel="stylesheet" href="../../../shared/css/alerts.css">

    <!--Bootstrap 5 CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!--box icons-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css?v=2' rel='stylesheet'>
</head>
<body>
    <!-- Sidebar will be injected here -->
    <div id="sidebar-container"></div>

    <section class="home">
        <div class="container-fluid p-0">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Admin Panel</h2>
                    <p class="text-muted mb-0 page-subtitle">Manage and Monitor the Appointment System.</p>
                </div>

                <!-- Profile Dropdown -->
                <div class="profile-dropdown">
                    <div class="profile-btn" onclick="toggleProfileMenu()">
                        <img src="../../../assets/logo-0.png" alt="Profile" id="profileBtnAvatar">
                        <div class="profile-info">
                            <p class="name" id="profileBtnName">Loading...</p>
                            <p class="student-id" id="profileBtnStudentId">Loading...</p>
                        </div>
                        <i class='bx bx-chevron-down dropdown-icon' aria-hidden="true"></i>
                    </div>
                    <div class="profile-menu" id="profileMenu">
                        <div class="profile-menu-header">
                            <img src="../../../assets/logo-0.png" alt="Profile" id="profileMenuAvatar">
                            <div>
                                <p class="name" id="profileMenuName">Loading...</p>
                                <p class="email" id="profileMenuEmail">Loading...</p>
                            </div>
                        </div>
                        <a href="#" class="profile-menu-item logout-item" onclick="logout(); return false;">
                            <i class='bx bx-log-out'></i>
                            Logout
                        </a>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-6 col-lg-3">
                    <a class="text-decoration-none" href="/appointment_system/pages/admin/students/students.html">
                        <div class="card border-0 shadow-sm h-100" style="border-radius: 16px;">
                            <div class="card-body">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <i class='bx bx-user fs-4 text-primary'></i>
                                    <h6 class="mb-0 fw-semibold text-dark">Students</h6>
                                </div>
                                <p class="text-muted mb-0">View list of students.</p>
                            </div>
                        </div>
                    </a>
                </div>

                <div class="col-md-6 col-lg-3">
                    <a class="text-decoration-none" href="/appointment_system/pages/admin/teachers/teachers.html">
                        <div class="card border-0 shadow-sm h-100" style="border-radius: 16px;">
                            <div class="card-body">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <i class='bx bx-user-pin fs-4 text-primary'></i>
                                    <h6 class="mb-0 fw-semibold text-dark">Teachers</h6>
                                </div>
                                <p class="text-muted mb-0">Weekly consulted minutes.</p>
                            </div>
                        </div>
                    </a>
                </div>

                <div class="col-md-6 col-lg-3">
                    <a class="text-decoration-none" href="/appointment_system/pages/admin/monitor-schedule/monitor-schedule.html">
                        <div class="card border-0 shadow-sm h-100" style="border-radius: 16px;">
                            <div class="card-body">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <i class='bx bx-calendar fs-4 text-primary'></i>
                                    <h6 class="mb-0 fw-semibold text-dark">Monitor Schedule</h6>
                                </div>
                                <p class="text-muted mb-0">View open/closed weekly slots.</p>
                            </div>
                        </div>
                    </a>
                </div>

                <div class="col-md-6 col-lg-3">
                    <a class="text-decoration-none" href="/appointment_system/pages/admin/requests/requests.html">
                        <div class="card border-0 shadow-sm h-100" style="border-radius: 16px;">
                            <div class="card-body">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <i class='bx bx-hourglass fs-4 text-primary'></i>
                                    <h6 class="mb-0 fw-semibold text-dark">Requests</h6>
                                </div>
                                <p class="text-muted mb-0">Pending + history combined.</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <script src="/appointment_system/shared/js/load-sidebar-admin.js"></script>
    <script src="/appointment_system/shared/js/alerts.js"></script>
    <script src="/appointment_system/shared/js/api.js"></script>

    <!--Bootstrap 5 JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script src="./dashboard.js"></script>
</body>
</html>
