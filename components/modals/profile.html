<!-- Profile Settings Modal -->
<div class="profile-modal-overlay" id="profileModalOverlay" onclick="closeProfileModal(event)">
    <div class="profile-modal" onclick="event.stopPropagation()">
        <!-- Close Button -->
        <button class="profile-modal-close" onclick="closeProfileModal()">
            <i class='bx bx-x'></i>
        </button>

        <!-- Profile Header -->
        <div class="profile-modal-header">
            <div class="profile-avatar-wrapper">
                <img src="/appointment_system/assets/logo-0.png" alt="Profile" class="profile-avatar" id="profileAvatar">
                <button class="avatar-edit-btn" onclick="document.getElementById('profilePictureInput').click()">
                    <i class='bx bx-pencil'></i>
                </button>
                <input type="file" id="profilePictureInput" accept="image/*" style="display: none;" onchange="handleProfilePictureChange(event)">
            </div>
            <div class="profile-header-info">
                <h4 id="profileHeaderName">Loading...</h4>
                <p id="profileHeaderEmail">Loading...</p>
            </div>
        </div>

        <!-- Profile Form -->
        <div class="profile-modal-body">
            <div class="profile-field">
                <label>Name</label>
                <input type="text" value="" id="profileName" readonly>
            </div>
            <div class="profile-field">
                <label>Email account</label>
                <input type="email" value="" id="profileEmail" readonly>
            </div>
            <div class="profile-field" id="studentNumberField">
                <label>Student number</label>
                <input type="text" value="" id="profileStudentNumber" readonly>
            </div>
            <div class="profile-field">
                <label>Branch</label>
                <input type="text" value="Santa Rosa" id="profileBranch" readonly>
            </div>
        </div>

        <!-- Save Button -->
        <div class="profile-modal-footer">
            <button class="save-profile-btn" onclick="saveProfileChanges()">Close</button>
        </div>
    </div>
</div>
