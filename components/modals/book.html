<!-- Booking Modal -->
<div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 rounded-4">
            <div class="modal-header border-0 pb-0">
                <div>
                    <h5 class="modal-title fw-bold" id="bookingModalLabel">Book Consultation - <span id="modalTeacherName">Ms. Kim Chaehyun</span></h5>
                    <p class="text-muted mb-0" id="modalDateTime">Tuesday, September 23, 2025 | 10:30 AM - 12:00 PM</p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-4">
                <!-- Time Slots -->
                <div class="time-slots-grid mb-4" id="timeSlotsContainer">
                    <!-- Time slots will be generated by JavaScript -->
                </div>

                <!-- Meeting Time -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Meeting time</label>
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2" type="button" id="meetingTimeDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class='bx bx-time-five'></i>
                            <span id="selectedMeetingTime">10 Minutes</span>
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="meetingTimeDropdown">
                            <li><a class="dropdown-item" href="#" onclick="selectMeetingTime(10)">10 Minutes</a></li>
                            <li><a class="dropdown-item" href="#" onclick="selectMeetingTime(15)">15 Minutes</a></li>
                            <li><a class="dropdown-item" href="#" onclick="selectMeetingTime(20)">20 Minutes</a></li>
                        </ul>
                    </div>
                </div>

                <!-- Reason/Topic -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Reason or topic for consultation</label>
                    <div class="reason-grid">
                        <button class="reason-btn" data-reason="grade" onclick="selectReason(this)">
                            <i class='bx bxs-graduation'></i>
                            <span>Grade Consultation</span>
                        </button>
                        <button class="reason-btn" data-reason="makeup" onclick="selectReason(this)">
                            <i class='bx bx-calendar-check'></i>
                            <span>Make-up / Missed Class</span>
                        </button>
                        <button class="reason-btn" data-reason="assignment" onclick="selectReason(this)">
                            <i class='bx bx-file'></i>
                            <span>Assignment / Project Consultation</span>
                        </button>
                        <button class="reason-btn" data-reason="exam" onclick="selectReason(this)">
                            <i class='bx bx-edit'></i>
                            <span>Exam / Quiz Consultation</span>
                        </button>
                        <button class="reason-btn" data-reason="inquiry" onclick="selectReason(this)">
                            <i class='bx bx-help-circle'></i>
                            <span>General Inquiry / Clarification</span>
                        </button>
                        <button class="reason-btn" data-reason="personal" onclick="selectReason(this)">
                            <i class='bx bx-user'></i>
                            <span>Personal / Guidance Consultation</span>
                        </button>
                        <button class="reason-btn" data-reason="others" onclick="selectReason(this)">
                            <i class='bx bx-dots-horizontal-rounded'></i>
                            <span>Others</span>
                        </button>
                    </div>
                </div>

                <!-- Location -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Location</label>
                    <div class="location-select">
                        <div class="location-option selected">
                            <i class='bx bx-buildings'></i>
                            <span>Faculty</span>
                        </div>
                    </div>
                </div>

                <!-- Notes -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Notes: <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="bookingNotes" placeholder="Describe your concern or question (required)">
                    <div class="text-danger small mt-1" id="notesError" style="display:none">Please enter a note before confirming.</div>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-primary px-4 rounded-pill" onclick="confirmBooking()">Confirm</button>
                <button type="button" class="btn btn-outline-secondary px-4 rounded-pill" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<!-- Booking Error Modal -->
<div class="modal fade" id="bookingErrorModal" tabindex="-1" aria-labelledby="bookingErrorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold" id="bookingErrorModalLabel">Unable to book</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-0">
                <p class="text-muted mb-0" id="bookingErrorMessage">You cannot book when you have a class at that time.</p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-primary px-4 rounded-pill" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>
