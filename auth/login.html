<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Appointment System</title>
    <link rel="stylesheet" href="login.css?v=2">
</head>
<body>
    <div class="container">
        <div class="form-box active" id="login-form">
            <form id="loginForm">
                <h2>Login</h2>
                <div class="error-message" id="login-error"></div>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p>Email not registered? <a href="#" onclick="showForm('register-form')">Register</a></p>
            </form>
        </div>

        <div class="form-box" id="register-form">
            <form id="registerForm">
                <h2>Register</h2>
                <div class="error-message" id="register-error"></div>
                <input type="text" name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <select name="role" id="roleSelect" required>
                    <option value="" hidden>--Select Role--</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
                
                <!-- Student-only fields (hidden by default) -->
                <div id="studentFields" style="display: none;">
                    <input type="text" name="studentNumber" id="studentNumberInput" placeholder="Student Number" required>
                    <select name="gradeLevel" id="gradeLevelSelect" required>
                        <option value="" hidden>--Select Grade Level--</option>
                        <option value="Grade 11">Grade 11</option>
                        <option value="Grade 12">Grade 12</option>
                    </select>
                    <select name="sectionId" id="sectionSelect" required disabled>
                        <option value="" hidden>--Select Section--</option>
                    </select>
                </div>
                
                <button type="submit">Register</button>
                <p>Email already registered? <a href="#" onclick="showForm('login-form')">Login</a></p>
            </form>
        </div>
    </div>

    <script src="login-new.js"></script>
</body>
</html>
