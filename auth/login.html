<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Appointment System</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../shared/css/alerts.css">
</head>
<body>
    <a class="site-logo-link" href="../pages/landing/landing.html" aria-label="Back to landing page">
        <img src="../assets/logo.png?v=4" alt="STI" class="site-logo">
    </a>
    <div class="container">
        <div class="form-box active" id="login-form">
            <form id="loginForm">
                <h2>Login</h2>
                <div class="error-message" id="login-error"></div>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p>Email not registered? <a href="#" onclick="showForm('register-form')">Register</a></p>
            </form>
        </div>

        <div class="form-box" id="register-form">
            <form id="registerForm">
                <h2>Register</h2>
                <div class="error-message" id="register-error"></div>
                <input type="text" name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <!-- Student fields -->
                <div id="studentFields">
                    <input type="text" name="studentNumber" id="studentNumberInput" placeholder="Student Number" required>
                    <select name="gradeLevel" id="gradeLevelSelect" required>
                        <option value="" hidden>--Select Grade Level--</option>
                        <option value="Grade 11">Grade 11</option>
                        <option value="Grade 12">Grade 12</option>
                    </select>
                    <select name="sectionId" id="sectionSelect" disabled required>
                        <option value="" hidden>--Select Section--</option>
                    </select>
                </div>
                
                <button type="submit">Register</button>
                <p>Email already registered? <a href="#" onclick="showForm('login-form')">Login</a></p>
            </form>
        </div>
    </div>

    <script src="../shared/js/alerts.js"></script>
    <script src="login-new.js"></script>
</body>
</html>
